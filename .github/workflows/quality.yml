name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Redacted source security guard
        run: node scripts/security-source-guard.mjs

      - name: Install
        run: npm ci

      - name: Verify installed dependency patch
        run: node scripts/patch-braces-security.mjs --check

      - name: Repository and dependency control tests
        run: node --test scripts/dependency-security.test.mjs scripts/security-source-guard.test.mjs scripts/lib/sanity-mutation.test.mjs scripts/release-inventory.test.mjs scripts/check-shop-readiness.test.mjs scripts/summarize-operational-logs.test.mjs

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET }}
          NEXT_PUBLIC_SANITY_API_VERSION: ${{ vars.NEXT_PUBLIC_SANITY_API_VERSION }}
          NEXT_PUBLIC_BASE_URL: ${{ vars.NEXT_PUBLIC_BASE_URL }}

      - name: Audit
        run: npm audit --audit-level=high

      - name: Release inventory and notices
        run: node scripts/release-inventory.mjs --production

      - name: Shop readiness
        run: npm run shop:readiness
        env:
          SHOP_READINESS_STATIC: "1"
          STRIPE_SECRET_KEY: sk_test_ci_fixture
          STRIPE_WEBHOOK_SECRET: whsec_ci_fixture
          NEXT_PUBLIC_BASE_URL: https://example.test
          GHL_SHOP_PURCHASE_WEBHOOK_URL: https://example.test/webhook
          NEXT_PUBLIC_SANITY_DATASET: public-ci-fixture
          SANITY_PAYMENT_DATASET: private-ci-fixture
          SANITY_PAYMENT_AUTH_TOKEN: fixture-ci-private-sanity-token
          SANITY_PAYMENT_PRIVATE_CONFIRMED: "true"
          SANITY_PAYMENT_MIGRATION_CONFIRMED: "true"
          GHL_SHOP_FULFILLMENT_ALLOWED_HOSTS: example.test
          GHL_SHOP_FULFILLMENT_SECRET: fixture-ci-fulfillment-secret-value-not-for-production
          GHL_SHOP_FULFILLMENT_CONTRACT_CONFIRMED: "true"
